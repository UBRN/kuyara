packages:
  - apps/*
  - packages/*

overrides:
  '@unrs/resolver-binding-wasm32-wasi@1.12.2>@napi-rs/wasm-runtime': 1.1.6
  # xcode only calls uuid.v4(); 11.1.1 keeps a CommonJS entry and closes GHSA-w5hq-g745-h8pq.
  'xcode>uuid': 11.1.1

# posthog-react-native/expo requires @expo/config-plugins from its own package directory,
# which pnpm's isolated layout cannot resolve; hoisting it to the root node_modules fixes
# `expo config`, prebuild and the EAS build.
publicHoistPattern:
  - '@expo/config-plugins'

allowBuilds:
  '@posthog/cli': false
  esbuild: true
  unrs-resolver: true
  workerd: true

minimumReleaseAgeExclude:
  - '@posthog/core@1.52.0'
  - '@posthog/types@1.409.4'
  - posthog-react-native@4.68.4
  - expo-insights@57.0.18 || 57.0.19 || 57.0.20
  - '@expo/cli@57.0.25 || 57.0.26 || 57.0.27'
  - '@expo/router-server@57.0.10 || 57.0.11'
  - babel-preset-expo@57.0.12 || 57.0.13
  - expo@57.0.23 || 57.0.24 || 57.0.25
  - expo-app-metrics@57.0.19 || 57.0.20 || 57.0.21
  - expo-background-task@57.0.18 || 57.0.19 || 57.0.20
  - expo-image-manipulator@57.0.18 || 57.0.19 || 57.0.20
  - expo-image-picker@57.0.18 || 57.0.19 || 57.0.20
  - expo-location@57.0.18 || 57.0.19 || 57.0.20
  - expo-notifications@57.0.19 || 57.0.20 || 57.0.21
  - expo-observe@57.0.22 || 57.0.23 || 57.0.24
  - expo-task-manager@57.0.18 || 57.0.19 || 57.0.20
  - expo-asset@57.0.18
  - expo-constants@57.0.19
  - '@expo/metro-runtime@57.0.16'
  - '@expo/ui@57.0.19 || 57.0.20'
  - expo-router@57.0.22 || 57.0.23
  - expo-updates@57.0.23
  - expo-modules-core@57.0.19
  - expo-modules-jsi@57.1.1
  - expo-glass-effect@57.0.4
  - expo-linking@57.0.11

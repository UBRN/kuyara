{%- assign ui_lang = page.lang | default: "en" | slice: 0, 2 -%}
{%- assign ui = site.data.ui[ui_lang] | default: site.data.ui.en -%}
<footer class="ku-footer">
  <div class="ku-shell">
    <nav class="ku-footer__links" aria-label="{{ ui.footer_nav_label }}">
      <a href="{{ ui.privacy_url | relative_url }}">{{ ui.privacy }}</a>
      <a href="{{ ui.support_url | relative_url }}">{{ ui.support }}</a>
      <a href="{{ ui.documents_url | relative_url }}">{{ ui.documents }}</a>
      <a href="https://github.com/UBRN/kuyara">{{ ui.source }}</a>
    </nav>
    <p class="ku-caption ku-footer__legal">{{ ui.licence }}</p>
    <p class="ku-caption ku-footer__legal">{{ ui.apple }}</p>
  </div>
</footer>

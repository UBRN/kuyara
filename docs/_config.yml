theme: jekyll-theme-primer
description: What to wear today? Every morning, kuyara has an outfit for the weather ready for you, from sunshine to snow. For iPhone, and all yours.
lang: en-US
plugins:
  - jekyll-sitemap
# The site publishes the landing, the privacy policy, support and the account terms, in both languages. The
# project's own documents stay in the repository and off the site.
exclude:
  - adr/
  - design/
  - analytics-taxonomy.md
  - architecture.md
  - clothing-taxonomy.md
  - current-status.md
  - product-decisions.md
  - roadmap.md
  - testing.md
languages:
  en: English
  tr: Türkçe
themes:
  en:
    label: Appearance
    system: System
    light: Light
    dark: Dark
  tr:
    label: Görünüm
    system: Sistem
    light: Açık
    dark: Koyu
defaults:
  - scope:
      path: ""
    values:
      locale: en_US
      image:
        path: /assets/img/og-image.png
        width: 1200
        height: 630
        alt: kuyara, an outfit for today's weather
  - scope:
      path: "tr"
    values:
      locale: tr_TR
      image:
        alt: kuyara, bugünün havasına göre kombin

theme: jekyll-theme-primer
description: Each morning, kuyara turns your weather into an outfit made for you. For iPhone, and all yours.
lang: en-US
# The site publishes the landing, the privacy policy, support and the account terms, in both languages. The
# project's own documents stay in the repository and off the site.
exclude:
  - adr/
  - design/
  - analytics-taxonomy.md
  - architecture.md
  - clothing-taxonomy.md
  - current-status.md
  - product-decisions.md
  - roadmap.md
  - testing.md
languages:
  en: English
  tr: Türkçe
themes:
  en:
    label: Appearance
    system: System
    light: Light
    dark: Dark
  tr:
    label: Görünüm
    system: Sistem
    light: Açık
    dark: Koyu
defaults:
  - scope:
      path: ""
    values:
      image:
        path: /assets/img/og-image.png
        width: 1200
        height: 630

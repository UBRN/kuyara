<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
{% seo %}
    {% include theme-head.html %}
    {% include head-custom.html %}
    {% include lang-head.html %}
    <link rel="stylesheet" href="{{ "/assets/css/site.css?v=" | append: site.github.build_revision | relative_url }}">
    <script defer src="{{ "/assets/js/doc.js?v=" | append: site.github.build_revision | relative_url }}"></script>
  </head>
  <body class="ku-page">
    {% include site-header.html %}
    <main id="ku-main" class="ku-shell ku-doc">
      {%- unless page.ref -%}
      {%- assign ui = site.data.ui.en -%}
      <a class="ku-doc__back" href="{{ ui.documents_url | relative_url }}"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M10 3.5 5.5 8l4.5 4.5"/></svg>{{ ui.documents }}</a>
      {%- endunless %}
      <article class="ku-prose">
        {{ content }}
      </article>
    </main>
    {% include site-footer.html %}
  </body>
</html>

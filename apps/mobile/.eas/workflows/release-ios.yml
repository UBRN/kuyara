name: Release iOS

# Manual only: this workflow has no push or pull_request trigger, so it runs
# only when it is started with `eas workflow:run`.
on:
  workflow_dispatch: {}

jobs:
  build_ios:
    name: Build iOS production
    type: build
    params:
      platform: ios
      profile: production

  submit_ios:
    name: Submit to App Store Connect
    type: submit
    needs: [build_ios]
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production

# Android is added later, as release-android.yml, once a Google Play account exists.

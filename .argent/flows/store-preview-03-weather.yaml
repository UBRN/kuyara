executionPrerequisite: >-
  The outfit detail screen is open.
steps:
  - tap: { id: tab-weather }
  - await: { visible: { id: weather-refresh-button }, timeout: 10000 }
  - wait: 1500
  - await: { idle: true }
  - echo: Drag the coming-hours rail so the clip shows it moving; the rail sits around y 0.62 on the 6.9-inch device.
  - tool: gesture-swipe
    args: { fromX: 0.8, fromY: 0.62, toX: 0.3, toY: 0.62, durationMs: 800 }
  - wait: 1800

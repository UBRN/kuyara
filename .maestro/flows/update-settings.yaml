appId: com.ubrn.kuyara
name: Update and persist settings
tags:
  - critical
  - ios
---
- launchApp:
    clearState: true
- assertVisible:
    id: onboarding-step-1
- tapOn:
    id: onboarding-continue
- tapOn:
    id: onboarding-gender-woman
- tapOn:
    id: onboarding-continue
- assertVisible:
    id: onboarding-step-3
- tapOn:
    id: onboarding-dress-style-smart
- tapOn:
    id: onboarding-continue
- assertVisible:
    id: onboarding-step-4
- tapOn:
    id: onboarding-continue
- assertVisible:
    id: onboarding-step-5
- tapOn:
    id: onboarding-complete
- assertVisible:
    id: today-screen
- tapOn:
    id: tab-profile
- tapOn:
    id: profile-settings-button
- assertVisible:
    id: settings-screen

# Language and appearance are value rows that push their own picker screen.
# Selection does not pop the picker, so each one is entered and left explicitly
# through the picker's own back control. A swipe-back gesture pops the whole
# Profile stack rather than one screen, and the control's accessibility label is
# localized, so this flow depends on its test id instead.
- tapOn:
    id: settings-language-row
- assertVisible:
    id: settings-language-picker
- tapOn:
    id: settings-language-tr
- assertVisible:
    id: settings-language-tr
    selected: true
- tapOn:
    id: settings-picker-back
- assertVisible:
    id: settings-screen

- tapOn:
    id: settings-theme-row
- assertVisible:
    id: settings-appearance-picker
- tapOn:
    id: settings-theme-dark
- assertVisible:
    id: settings-theme-dark
    selected: true
- tapOn:
    id: settings-picker-back
- assertVisible:
    id: settings-screen

# Gender sits in the final About you group, so it needs a scroll and opens its own picker.
- scrollUntilVisible:
    element:
      id: settings-gender-row
    direction: DOWN
- tapOn:
    id: settings-gender-row
- assertVisible:
    id: settings-gender-picker
- tapOn:
    id: settings-gender-man
- assertVisible:
    id: settings-gender-man
    selected: true
- tapOn:
    id: settings-picker-back
- assertVisible:
    id: settings-screen

- launchApp
- tapOn:
    id: tab-profile
- tapOn:
    id: profile-settings-button
- assertVisible:
    id: settings-screen

# The two picker rows sit at the top of Settings, so they are checked before the
# scroll that brings gender into view and pushes them off screen.
- tapOn:
    id: settings-language-row
- assertVisible:
    id: settings-language-tr
    selected: true
- tapOn:
    id: settings-picker-back
- tapOn:
    id: settings-theme-row
- assertVisible:
    id: settings-theme-dark
    selected: true
- tapOn:
    id: settings-picker-back
- scrollUntilVisible:
    element:
      id: settings-gender-row
    direction: DOWN
- tapOn:
    id: settings-gender-row
- assertVisible:
    id: settings-gender-man
    selected: true
- tapOn:
    id: settings-picker-back

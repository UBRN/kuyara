appId: com.ubrn.kuyara
name: Update and persist settings
tags:
  - critical
  - ios
---
- launchApp:
    clearState: true
- assertVisible:
    id: onboarding-step-1
- tapOn:
    id: onboarding-continue
- assertVisible:
    id: onboarding-step-2
- tapOn:
    id: onboarding-continue
- assertVisible:
    id: onboarding-step-3
- tapOn:
    id: onboarding-name-skip
- assertVisible:
    id: onboarding-step-4
- tapOn:
    id: onboarding-gender-woman
- tapOn:
    id: onboarding-continue
- assertVisible:
    id: onboarding-step-5
- tapOn:
    id: onboarding-dress-style-smart
- tapOn:
    id: onboarding-continue
- assertVisible:
    id: onboarding-step-6
- tapOn:
    id: onboarding-continue
- assertVisible:
    id: onboarding-step-7
- tapOn:
    id: onboarding-consent-decline
- runFlow: ../subflows/close-day-type-sheet.yaml
- assertVisible:
    id: today-screen
- tapOn:
    id: tab-profile
- tapOn:
    id: profile-settings-button
- assertVisible:
    id: settings-screen

# Language, appearance, gender and dress style are native menu-style Picker rows. The choices
# are system menu entries: they carry no test id and are reachable only by their visible text.
# Selection happens in place, so nothing is pushed and nothing has to be popped afterwards.
#
# The row itself exposes no test id either. The SwiftUI section's identifier is what reaches the
# accessibility tree, so `settings-language-row` and its siblings never appear there. Each row is
# a single button whose accessibility text is "<label>, <current value>", the way the plain rows
# beside it read "Bildirimler, Kapalı", so that one string both opens the row and asserts its
# saved value, and the tap lands on the row's own centre.
#
# Language and Theme sit in the Appearance group, below Profile and Notifications, so each needs
# a scroll before its menu can open.
#
# "Türkçe" is spelled identically in both message tables, so this first selection lands whatever
# language the device starts the app in; every step after it reads the Turkish copy it produces.
- scrollUntilVisible:
    element:
      text: "(Dil|Language), (Sistem|System)"
    direction: DOWN
- tapOn: "(Dil|Language), (Sistem|System)"
- tapOn: "Türkçe"
- assertVisible: "Dil, Türkçe"

- scrollUntilVisible:
    element:
      text: "Tema, Sistem"
    direction: DOWN
- tapOn: "Tema, Sistem"
- tapOn: "Koyu"
- assertVisible: "Tema, Koyu"

# Gender sits in the Profile group at the top of Settings, so it scrolls back up into view.
- scrollUntilVisible:
    element:
      text: "Cinsiyet, .*"
    direction: UP
- tapOn: "Cinsiyet, Kadın"
- tapOn: "Erkek"
- assertVisible: "Cinsiyet, Erkek"

- launchApp
- runFlow: ../subflows/close-day-type-sheet.yaml
- tapOn:
    id: tab-profile
- tapOn:
    id: profile-settings-button
- assertVisible:
    id: settings-screen

# Gender sits in the Profile group at the top of Settings, so it is checked before the scroll
# that brings Language and Theme into view. Each row renders its own saved value, so the value
# text is the assertion; no picker has to be opened to read it back.
- scrollUntilVisible:
    element:
      text: "Cinsiyet, .*"
    direction: DOWN
- assertVisible: "Cinsiyet, Erkek"
- scrollUntilVisible:
    element:
      text: "Dil, Türkçe"
    direction: DOWN
- assertVisible: "Dil, Türkçe"
- scrollUntilVisible:
    element:
      text: "Tema, Koyu"
    direction: DOWN
- assertVisible: "Tema, Koyu"

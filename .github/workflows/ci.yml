name: CI

# Every third-party action is pinned to a full commit SHA with its release tag in
# the trailing comment; Dependabot's github-actions ecosystem bumps both together.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No version input: the pnpm version comes from the packageManager field
      # in the root package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Typed routes: `expo start` normally writes the git-ignored expo-env.d.ts and
      # .expo/types/router.d.ts that the mobile typecheck depends on. On a fresh
      # checkout they do not exist, so generate them the way the Expo docs prescribe.
      - name: Generate Expo types
        run: pnpm --filter @kuyara/mobile exec expo customize tsconfig.json

      # expo-doctor is not a workspace dependency, so it runs through dlx.
      - name: Expo Doctor
        run: pnpm dlx expo-doctor@latest
        working-directory: apps/mobile

      - name: Lint, typecheck, test and bundle the Worker
        run: pnpm check

      - name: Component tests
        run: pnpm --filter @kuyara/mobile test:components

  dependency-review:
    name: Dependency review
    # Only a pull request has a base and a head to compare.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review the dependency diff
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

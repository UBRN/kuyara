name: Secret scan

# gitleaks over the pushed or proposed commits, with the same .gitleaks.toml the
# local pre-commit hook reads. GitHub secret scanning and push protection stay on;
# this covers the patterns they do not (a PEM private key such as the WeatherKit
# .p8, high-entropy generic keys) and commits made with --no-verify or without
# gitleaks installed. A manual run scans the whole history.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The action scans a commit range, so it needs the history.
          fetch-depth: 0

      # gitleaks-action is EULA-licensed; a licence key is required only for
      # organization-owned repositories, not for this personal account.
      # GITLEAKS_VERSION overrides the action's default binary (8.24.3), which
      # predates the [[allowlists]] syntax used in .gitleaks.toml.
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_CONFIG: .gitleaks.toml
          # PR comments would need pull-requests: write; the job summary is enough.
          GITLEAKS_ENABLE_COMMENTS: "false"
